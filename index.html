<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Extension Collection</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header class="hero">

        <h1>Extension Collection</h1>

        <p>Browse special, totally-semi-rare-use-case extensions.</p>

        <input
            id="search"
            type="text"
            placeholder="Search extensions..."
            autocomplete="off"
        >

    </header>

    <main>

        <div id="extensionGrid" class="grid">

            <div class="loading">
                Loading extensions...
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
