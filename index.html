<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Extension Collection</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header class="hero">

        <h1>
            Extension Collection
        </h1>

        <p>
            Explore and download extensions.
        </p>


        <!-- ===================== -->
        <!-- Search Row -->
        <!-- ===================== -->

        <div class="search-row">


            <!-- Main Extensions -->

            <button
                class="main-page-button"
                id="mainPageButton"
                title="Extensions"
                aria-label="Extensions"
            >
                M
            </button>


            <!-- Dependencies -->

            <button
                class="dependencies-button"
                id="dependenciesButton"
                title="Dependencies"
                aria-label="Dependencies"
            >
                D
            </button>


            <!-- Search -->

            <input
                type="text"
                id="search"
                placeholder="Search extensions..."
                autocomplete="off"
            >

        </div>

    </header>



    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main>

        <div
            class="grid"
            id="extensionGrid"
        >

            <div class="loading">
                Loading Extensions...
            </div>

        </div>

    </main>



    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->

    <script
        src="script.js"
    ></script>


</body>

</html>
